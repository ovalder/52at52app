<script>
  (async function () {
    const overview = 'summaries/season-two-the-challenge-continues/index.html';
    const { hash, search } = location;
    if (hash === '#overview' || hash === '#comments') {
      location.replace(overview + search + hash);
      return;
    }
    let latest = 0;
    try {
      const response = await fetch('data/weeks.json', { cache: 'no-cache' });
      if (response.ok) {
        const weeks = await response.json();
        if (Array.isArray(weeks)) {
          latest = weeks.reduce(function (highest, entry) {
            const number = entry && entry.week;
            return Number.isInteger(number) && number > highest ? number : highest;
          }, 0);
        }
      }
    } catch {
      // If the week list cannot load, open the overview instead.
    }
    const destination = latest
      ? 'weeks/week-' + String(latest).padStart(2, '0') + '/index.html'
      : overview;
    location.replace(destination + search);
  })();
</script>
